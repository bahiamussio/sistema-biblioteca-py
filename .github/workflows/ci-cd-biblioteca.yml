name: CI/CD - Sistema Biblioteca Haku

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  calidad-codigo:
    name: Analisis Estatico y Linting (Flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar herramienta Flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Verificar sintaxis critica y estilo PEP 8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  pruebas-automatizadas:
    name: Pruebas Unitarias y Compilacion
    runs-on: ubuntu-latest
    needs: calidad-codigo
    steps:
      - name: Obtener codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verificar compilacion de modulos Python
        run: |
          python -m py_compile main.py biblioteca.py clases/*.py

      - name: Ejecutar suite de pruebas unitarias
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  entrega-continua:
    name: Empaquetado de Release para Produccion
    runs-on: ubuntu-latest
    needs: pruebas-automatizadas
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: produccion-biblioteca-haku
    steps:
      - name: Obtener codigo verificado
        uses: actions/checkout@v4

      - name: Generar paquete comprimido (.zip)
        run: |
          mkdir -p dist
          zip -r dist/sistema-biblioteca-haku-${{ github.sha }}.zip main.py biblioteca.py clases/ README.md

      - name: Publicar artefacto listo para despliegue
        uses: actions/upload-artifact@v4
        with:
          name: release-biblioteca-haku
          path: dist/sistema-biblioteca-haku-*.zip
          retention-days: 30
